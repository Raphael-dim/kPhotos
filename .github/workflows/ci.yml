name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: xcode-27 # Official GitHub Xcode image; required by the iOS 27 SDK usage.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Xcode SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | python3 -c 'import sys; assert int(sys.stdin.read().split(".")[0]) >= 27'

      - name: Install Mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true

      - name: Scan for secrets
        run: make check-secrets

      - name: Generate project
        run: make generate

      - name: Check source headers and formatting
        run: make check-headers format-check

      - name: Lint
        run: make lint-ci

      - name: Build & test
        run: |
          xcodebuild test \
            -workspace kPhotos.xcworkspace \
            -scheme kPhotos \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
