name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: xcode-27 # Official GitHub Xcode image; required by the iOS 27 SDK usage.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Xcode SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | python3 -c 'import sys; assert int(sys.stdin.read().split(".")[0]) >= 27'

      - name: Install Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Scan for secrets
        run: make check-secrets

      - name: Generate project
        run: make generate

      - name: Check source headers and formatting
        run: make check-headers format-check

      - name: Lint
        run: make lint-ci

      - name: Build & test
        run: |
          xcodebuild test \
            -workspace kPhotos.xcworkspace \
            -scheme kPhotos \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
