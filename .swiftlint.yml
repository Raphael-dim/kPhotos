included:
  - kPhotos
  - kPhotosCore
  - kPhotosCoreUI
  - kPhotosFeatures
  - kPhotosResources
  - kPhotosShareExtension
  - kPhotosWidget
  - kPhotosTests
  - kPhotosUITests

excluded:
  - Derived
  - Tuist/.build
  - "**/.build"
  - "**/Generated"

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - private_subject
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 130
  error: 160
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: false

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 4

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 70
  excluded:
    - id
    - db
    - to
    - at
    - up
    - in
    - vc
    - x
    - y
    - z

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 50
    error: 70

file_header:
  required_pattern: |
                    \/\*
                     Infomaniak kPhotos - iOS App
                     Copyright \(C\) \d{4} Infomaniak Network SA
                    [\s\S]*?
                     \*\/

custom_rules:
  no_print:
    name: "Forbid print"
    regex: '(?<!\.)print\('
    message: "Use Sentry or Logger, not print()."
    severity: warning
    excluded: ".*Tests/.*"

  no_force_try:
    name: "Force try forbidden"
    regex: "try!"
    message: "force-try interdit. Utiliser do/try/catch ou propager throws."
    severity: error
    excluded: ".*Tests/.*"

  no_raw_user_string:
    name: "Raw user-facing strings"
    regex: 'Text\("[^"]+"\)'
    message: "Strings user-facing doivent passer par kPhotosResources."
    severity: warning
    excluded: ".*(Tests|Preview|Widget/.*Preview).*"

  swiftui_property_wrapper_private:
    name: "SwiftUI property wrappers must be private"
    regex: '^\s*@(State|StateObject|ObservedObject|EnvironmentObject|Environment|Binding|FocusState|GestureState)\s+(?!private)var'
    message: "Les property wrappers SwiftUI doivent être privés."
    severity: warning
